name: Self-Healing Security CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t self-healing-app:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: self-healing-app:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: self-healing-app:ci
          format: cyclonedx
          output: sbom-ci.json
          exit-code: 0

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: security-sbom
          path: sbom-ci.json
